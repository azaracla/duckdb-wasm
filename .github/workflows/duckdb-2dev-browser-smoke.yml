# Separate lightweight browser gate; NEVER recompiles DuckDB or runs the main matrix.
name: DuckDB 2 alpha / browser SQL smoke

on:
  push:
    branches:
      - feat/duckdb-2dev-async-http
    paths:
      - .github/workflows/duckdb-2dev-browser-smoke.yml
      - packages/duckdb-wasm/src/targets/duckdb-browser-coi.pthread.worker.ts
      - packages/duckdb-wasm/src/targets/duckdb-browser-coi.worker.ts
      - packages/duckdb-wasm/src/bindings/bindings_browser_coi.ts
      - packages/duckdb-wasm/src/bindings/bindings_browser_base.ts
      - tools/async-io/coi-smoke/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: alpha-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPHA_SMOKE_DEPS: ${{ github.workspace }}/.alpha-smoke-deps
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0

      - name: Select verified 8-worker COI artifact from successful compilation job
        id: source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {os.environ["GITHUB_TOKEN"]}',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def fetch(url):
              with urlopen(Request(url, headers=headers), timeout=30) as response:
                  return json.load(response)

          params = urlencode({'branch': 'feat/duckdb-2dev-async-http', 'status': 'completed', 'per_page': 50})
          runs = fetch(f'https://api.github.com/repos/{repo}/actions/workflows/duckdb-2dev-coi.yml/runs?{params}')['workflow_runs']
          # Do not silently fall back to the old four-worker build: its browser test deadlocked.
          fixed_at = '722ce810cfd7b43523e654195b227b2f9de4e521'
          for run in sorted(runs, key=lambda item: item['id'], reverse=True):
              sha = run['head_sha']
              if subprocess.run(['git', 'merge-base', '--is-ancestor', fixed_at, sha], check=False).returncode != 0:
                  continue
              if subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'HEAD'], check=False).returncode != 0:
                  continue
              jobs = fetch(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/jobs?per_page=100')['jobs']
              if not any(job['name'] == 'coi' and job['conclusion'] == 'success' for job in jobs):
                  continue
              artifacts = fetch(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/artifacts?per_page=100')['artifacts']
              if not any(artifact['name'] == 'alpha-coi-runtime' and not artifact['expired'] for artifact in artifacts):
                  continue
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write(f'run_id={run["id"]}\n')
              print(f'Selected verified 8-worker COI artifact: run {run["id"]}, commit {sha}; compilation job green')
              break
          else:
              raise SystemExit('No corrected 8-worker COI run with successful compilation and live runtime artifact')
          PY

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: alpha-coi-runtime
          path: packages/duckdb-wasm/src/bindings

      - name: Verify exact runtime artifacts without rebuilding
        shell: bash
        run: |
          for file in duckdb-coi.js duckdb-coi.wasm duckdb-coi.pthread.js; do
            test -s "packages/duckdb-wasm/src/bindings/$file"
          done
          node --check packages/duckdb-wasm/src/bindings/duckdb-coi.js
          node tools/async-io/check_generated_coi.mjs packages/duckdb-wasm/src/bindings/duckdb-coi.js

      - name: Install ONLY isolated browser smoke dependencies
        shell: bash
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser
          npm install --prefix "$ALPHA_SMOKE_DEPS" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund \
            esbuild@0.20.2 apache-arrow@17.0.0 qs@6.14.1 puppeteer-core@22.8.0 \
            wasm-feature-detect@1.6.1 web-worker@1.2.0 js-sha256@0.11.1

      - name: Bundle ONLY browser API, COI dispatcher and pthread wrapper
        shell: bash
        run: node tools/async-io/coi-smoke/build.mjs "$RUNNER_TEMP/coi-site"

      - name: Generate deterministic multi-row-group Parquet fixture
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --no-input pyarrow==21.0.0
          python3 - <<'PY'
          import os
          import pyarrow as pa
          import pyarrow.parquet as pq

          path = os.path.join(os.environ['RUNNER_TEMP'], 'async-io-fixture.parquet')
          rows = 200_000
          table = pa.table({
              'id': pa.array(range(rows), type=pa.int64()),
              'bucket': pa.array((i % 97 for i in range(rows)), type=pa.int32()),
              'value': pa.array((float(i % 1000) / 10 for i in range(rows)), type=pa.float64()),
          })
          pq.write_table(
              table,
              path,
              row_group_size=10_000,
              compression='snappy',
              use_dictionary=False,
          )
          metadata = pq.ParquetFile(path).metadata
          assert metadata.num_row_groups == 20, metadata.num_row_groups
          print(f'Parquet fixture: {path}, rows={metadata.num_rows}, row_groups={metadata.num_row_groups}, bytes={os.path.getsize(path)}')
          PY

      - name: Headless Chrome — DuckDB SQL plus one-query overlapping HTTP Range acceptance
        shell: bash
        env:
          ALPHA_PARQUET_FIXTURE: ${{ runner.temp }}/async-io-fixture.parquet
          ALPHA_RANGE_DELAY_MS: "150"
        run: |
          set -o pipefail
          node tools/async-io/coi-smoke/run.cjs "$RUNNER_TEMP/coi-site" 2>&1 | tee browser-smoke.log

      - name: Upload browser smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-coi-standalone-browser-smoke-log
          path: browser-smoke.log
          if-no-files-found: ignore
          retention-days: 2
