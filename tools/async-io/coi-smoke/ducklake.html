<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DuckDB 2 DuckLake browser acceptance</title></head>
<body><pre id="result">DuckLake loading</pre>
<script type="module">
import * as duckdb from './duckdb-browser.mjs';
const status = window.__ducklakeSmoke = { done: false, ok: false, stage: 'startup', checks: [] };
let db;
try {
  if (!crossOriginIsolated || typeof SharedArrayBuffer === 'undefined') throw new Error('COOP/COEP and SharedArrayBuffer required');
  status.checks.push('crossOriginIsolated');
  status.stage = 'instantiate DuckDB';
  const worker = new Worker('./duckdb-browser-coi.worker.js');
  db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(), worker);
  await db.instantiate(new URL('./duckdb-coi.wasm', location.href).href,
    new URL('./duckdb-browser-coi.pthread.worker.js', location.href).href);
  status.version = await db.getVersion();
  if (!/2\.0\.0/.test(status.version)) throw new Error(`Wrong DuckDB version: ${status.version}`);
  status.checks.push('pinned DuckDB 2 runtime');
  // Test-only trust bypass for exact pinned CI side module, not production.
  status.stage = 'open bounded in-memory database';
  await db.open({ path: ':memory:', maximumThreads: 2, allowUnsignedExtensions: true,
    filesystem: { reliableHeadRequests: true, allowFullHTTPReads: false, forceFullHTTPReads: false } });
  const connection = await db.connect();
  try {
    await connection.query('SET threads=2');
    await connection.query('SET async_threads=1');
    const settings = await connection.query("SELECT current_setting('threads')::INTEGER AS threads, current_setting('async_threads')::INTEGER AS async_threads");
    status.ioSettings = { threads: Number(settings.getChild('threads')?.get(0)), asyncThreads: Number(settings.getChild('async_threads')?.get(0)) };
    if (status.ioSettings.threads !== 2 || status.ioSettings.asyncThreads !== 1) throw new Error(`Unexpected worker settings: ${JSON.stringify(status.ioSettings)}`);
    status.checks.push('bounded two CPU threads and one async I/O thread');
    const before = await connection.query('SELECT 42 AS answer');
    if (Number(before.getChild('answer')?.get(0)) !== 42) throw new Error('SELECT 42 failed');
    status.checks.push('SQL before extension load');
    status.stage = 'fetch and validate DuckLake side module';
    const response = await fetch('./ducklake.duckdb_extension.wasm', { cache: 'no-store' });
    if (!response.ok) throw new Error(`DuckLake artifact HTTP ${response.status}`);
    const bytes = new Uint8Array(await response.arrayBuffer());
    if (!bytes.length || !WebAssembly.validate(bytes)) throw new Error('Invalid or empty DuckLake WASM extension');
    status.extensionBytes = bytes.length;
    status.checks.push('DuckLake WebAssembly.validate');
    await db.registerFileBuffer('ducklake.duckdb_extension', bytes);
    status.checks.push('DuckLake WASM side module registered with valid suffix');
    status.stage = 'LOAD ducklake (dlopen / extension init)';
    await connection.query("LOAD 'ducklake.duckdb_extension'");
    status.checks.push('LOAD DuckLake in real Chromium WASM');
    status.stage = 'verify duckdb_extensions';
    const extensions = await connection.query("SELECT extension_name, loaded FROM duckdb_extensions() WHERE extension_name = 'ducklake'");
    if (extensions.numRows !== 1 || extensions.getChild('loaded')?.get(0) !== true) throw new Error('duckdb_extensions does not report ducklake as loaded');
    status.checks.push('DuckLake loader reports loaded=true');
    const after = await connection.query('SELECT 42 AS answer');
    if (Number(after.getChild('answer')?.get(0)) !== 42) throw new Error('SQL after extension load failed');
    status.checks.push('SQL after extension load');

    // In-memory catalog isolates the next DuckLake gate from the known bug in
    // browser creation of a previously missing secondary metadata.ducklake file.
    // Inlining keeps these two rows in the catalog: remote Parquet I/O is a
    // separate mandatory acceptance gate and is NOT proven by this test.
    status.stage = 'ATTACH in-memory DuckLake catalog';
    await connection.query("ATTACH 'ducklake:duckdb::memory:' AS lake (DATA_PATH 'lake-data/', DATA_INLINING_ROW_LIMIT 100)");
    status.checks.push('DuckLake ATTACH succeeded');
    status.stage = 'CREATE DuckLake table';
    await connection.query('CREATE TABLE lake.vessels (id INTEGER, mmsi BIGINT)');
    status.stage = 'INSERT DuckLake inlined rows';
    await connection.query('INSERT INTO lake.vessels VALUES (1, 227123456), (2, 227654321)');
    status.stage = 'query DuckLake table';
    const rows = await connection.query('SELECT COUNT(*)::INTEGER AS n, SUM(id)::INTEGER AS total FROM lake.vessels');
    status.ducklake = { count: Number(rows.getChild('n')?.get(0)), idSum: Number(rows.getChild('total')?.get(0)) };
    if (status.ducklake.count !== 2 || status.ducklake.idSum !== 3) throw new Error(`Wrong DuckLake result: ${JSON.stringify(status.ducklake)}`);
    status.checks.push('DuckLake ATTACH/CREATE/INSERT/SELECT in-memory end-to-end');
  } finally {
    await connection.close();
  }
  status.ok = true;
  status.stage = 'completed';
} catch (error) {
  status.error = error instanceof Error ? `${error.message}\n${error.stack || ''}` : String(error);
  console.error('DUCKLAKE BROWSER FAILED', status.error);
} finally {
  if (db) try { await db.terminate(); } catch (error) { console.error('DuckDB terminate failed', error); }
  status.done = true;
  document.querySelector('#result').textContent = JSON.stringify(status, null, 2);
  console.log('DUCKLAKE BROWSER RESULT', JSON.stringify(status));
}
</script></body></html>
