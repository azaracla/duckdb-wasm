<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DuckDB 2 COI SQL smoke</title></head>
<body>
<pre id="result">COI SQL smoke running</pre>
<script type="module">
import * as duckdb from './duckdb-browser.mjs';

const status = window.__alphaSmoke = { done: false, ok: false, checks: [] };
let db;
try {
  if (!crossOriginIsolated || typeof SharedArrayBuffer === 'undefined') {
    throw new Error('COOP/COEP isolation and SharedArrayBuffer are required');
  }
  status.checks.push('crossOriginIsolated');
  const worker = new Worker('./duckdb-browser-coi.worker.js');
  db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(), worker);
  await db.instantiate(
    new URL('./duckdb-coi.wasm', location.href).href,
    new URL('./duckdb-browser-coi.pthread.worker.js', location.href).href,
  );
  const version = await db.getVersion();
  if (!/2\.0\.0/.test(version)) throw new Error(`Unexpected DuckDB version: ${version}`);
  status.version = version;
  status.checks.push('runtime initialization and DuckDB 2 version');

  await db.open({
    path: ':memory:',
    maximum_threads: 4,
    filesystem: {
      reliableHeadRequests: true,
      allowFullHTTPReads: false,
      forceFullHTTPReads: false,
    },
  });
  const connection = await db.connect();
  try {
    const scalar = await connection.query('SELECT 42 AS answer');
    const value = scalar.getChild('answer')?.get(0);
    if (Number(value) !== 42) throw new Error(`SELECT 42 returned ${String(value)}`);
    status.checks.push('SELECT 42');

    // This verifies DuckDB honours 1/2/4 thread settings; it does not prove
    // simultaneous HTTP Range requests. That remains a separate test gate.
    for (const count of [1, 2, 4]) {
      await connection.query(`SET threads=${count}`);
      const result = await connection.query("SELECT current_setting('threads')::INTEGER AS configured_threads, 42 AS answer");
      const observed = Number(result.getChild('configured_threads')?.get(0));
      const answer = Number(result.getChild('answer')?.get(0));
      if (observed !== count || answer !== 42) {
        throw new Error(`threads=${count}: observed ${observed}, SELECT returned ${answer}`);
      }
      status.checks.push(`threads=${count}, SQL=42`);
    }

    // Opt-in performance acceptance gate, NEVER a synthetic fetch benchmark.
    // run.cjs supplies rangeBase only when ALPHA_PARQUET_FIXTURE points to an
    // actual Parquet fixture. Reset the trace immediately before ONE DuckDB
    // query so unrelated browser probes cannot count as query-originated I/O.
    const rangeBase = new URL(location.href).searchParams.get('rangeBase');
    if (rangeBase !== null) {
      const base = new URL(rangeBase);
      if (base.protocol !== 'http:' || base.hostname !== '127.0.0.1' || base.pathname !== '/' || base.search || base.hash) {
        throw new Error('Range fixture must be the local 127.0.0.1 HTTP origin');
      }
      const origin = base.origin;
      // DuckDB 2 alpha WASM routes remote files through the browser filesystem.
      // Register the HTTP URL explicitly, then query the registered logical path.
      await db.registerFileURL(
        'fixture.parquet',
        `${origin}/fixture.parquet`,
        duckdb.DuckDBDataProtocol.HTTP,
        false,
      );
      await connection.query("SET async_threads=2");
      await connection.query("SET read_ahead_depth=4");
      const ioSettings = await connection.query(
        "SELECT current_setting('threads')::INTEGER AS threads, current_setting('async_threads')::INTEGER AS async_threads, current_setting('read_ahead_depth')::INTEGER AS read_ahead_depth"
      );
      status.ioSettings = {
        threads: Number(ioSettings.getChild('threads')?.get(0)),
        asyncThreads: Number(ioSettings.getChild('async_threads')?.get(0)),
        readAheadDepth: Number(ioSettings.getChild('read_ahead_depth')?.get(0)),
      };
      const reset = await fetch(`${origin}/__reset`, { cache: 'no-store' });
      if (!reset.ok) throw new Error(`Trace reset failed: HTTP ${reset.status}`);
      // This HTTP URL is derived only from the validated local origin above.
      const query = "SELECT SUM(id)::HUGEINT AS id_sum FROM read_parquet('fixture.parquet')";
      const startedAt = performance.now();
      const rows = await connection.query(query);
      const idSum = String(rows.getChild('id_sum')?.get(0));
      if (idSum !== '19999900000') throw new Error(`Unexpected SUM(id): ${idSum}`);
      status.parquet = { idSum, queryMs: performance.now() - startedAt };
      const response = await fetch(`${origin}/__trace`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Trace fetch failed: HTTP ${response.status}`);
      status.rangeTrace = await response.json();
      const trace = status.rangeTrace;
      if (trace.completed_range_gets < 2 || trace.max_overlapping_ranges < 2) {
        throw new Error(`DuckDB Parquet I/O not concurrent: completed_range_gets=${trace.completed_range_gets}, max_overlapping_ranges=${trace.max_overlapping_ranges}`);
      }
      if (!trace.events.filter(event => event.method === 'GET' && event.range).every(event => event.status === 206)) {
        throw new Error('One or more Parquet Range responses were not HTTP 206');
      }
      status.checks.push('one DuckDB Parquet query with >=2 overlapping HTTP Range reads');
      console.log('DUCKDB PARQUET RANGE TRACE', JSON.stringify({ parquet: status.parquet, trace }));
    }
  } finally {
    await connection.close();
  }
  status.ok = true;
} catch (error) {
  status.error = error instanceof Error ? `${error.message}\n${error.stack || ''}` : String(error);
  console.error('COI SMOKE FAILED', status.error);
} finally {
  if (db) {
    try { await db.terminate(); } catch (error) { console.error('terminate failed', error); }
  }
  status.done = true;
  document.querySelector('#result').textContent = JSON.stringify(status, null, 2);
  console.log('COI SMOKE RESULT', JSON.stringify(status));
}
</script>
</body>
</html>
